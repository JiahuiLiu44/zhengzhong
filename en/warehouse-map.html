(function applyNeutralStateColor(model, activeStateIds, linearRGB) {
  const activeStates = new Set(activeStateIds);
  const changed = [];
  model.traverse(state => {
    const id = state.userData.stateId;
    if (!id || activeStates.has(id)) return;
    const tile = state.getObjectByName(state.name + '-tile');
    if (!tile?.geometry) return;
    const normals = tile.geometry.attributes.normal;
    const colors = tile.geometry.attributes.color;
    if (!normals || !colors) return;
    for (let i = 0; i < colors.count; i++) {
      if (normals.getY(i) > .5) colors.setXYZ(i, ...linearRGB);
    }
    colors.needsUpdate = true;
    changed.push(id);
  });
  return changed;
})(window.__warehouseMap.model,["10","06","20"],[0.5972017883558645,0.6307571363387763,0.6653872982754769]);

const getCompassBearing=function compassBearing(camera) {
  camera.updateMatrixWorld();
  const matrix = camera.matrixWorld.elements;
  // Geographic north is world -Z. Project it onto the camera's right/up axes.
  const right = -matrix[2];
  const up = -matrix[6];
  if (Math.hypot(right, up) < 1e-8) return 0;
  return Math.atan2(right, up) * 180 / Math.PI;
};
let lastCompassBearing;
function syncCompass(){
  const bearing=getCompassBearing(window.__warehouseMap.camera);
  if(lastCompassBearing===undefined||Math.abs(bearing-lastCompassBearing)>.01){
    compass.style.transform='rotate('+bearing+'deg)';
    northLabel.style.transform='rotate('+(-bearing)+'deg)';
    lastCompassBearing=bearing;
  }
  requestAnimationFrame(syncCompass);
}
